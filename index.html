<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>신현준T</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e4;--card:#fffdf7;--ink:#26312c;--mute:#7b857f;--line:#e4dcc6;--g:#1f4d3f;--g2:#2f6b58;--y:#f2b93b;--r:#d9573b;--b:#3b6fb6}
*{box-sizing:border-box}body{margin:0;font:15px/1.6 'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
aside{width:240px;flex-shrink:0;background:var(--g);color:#eaf3ee;padding:24px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
aside h1{font-size:22px;margin:0 8px 2px;font-weight:900}aside small{margin:0 8px 18px;color:#a9c7ba}
aside button.nav{all:unset;cursor:pointer;padding:10px 14px;border-radius:10px;font-weight:500}
aside button.nav:hover{background:#ffffff1a}aside button.nav.on{background:var(--y);color:#2b2200;font-weight:700}
.who{margin-top:auto;background:#ffffff14;padding:12px;border-radius:12px;font-size:13px}
main{flex:1;min-width:0;padding:28px 40px;max-width:1560px}
h2{font-size:26px;margin:0 0 4px;font-weight:900}.sub{color:var(--mute);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
a,.big,.row{overflow-wrap:anywhere}.md input,.md textarea{max-width:100%}
.cal i.as{background:#fbe1da;color:var(--r);cursor:pointer}.cal i.dl{background:#fdf0cd;color:#8a6200;cursor:pointer}
.legend{display:flex;gap:12px;font-size:12px;color:var(--mute);margin-top:10px}.legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--c)}
.chk{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 12px;margin:8px 0 4px}.chk label{all:unset;display:flex;gap:6px;align-items:center;font-size:14px;cursor:pointer}.chk input{width:auto}
.danger{border-color:#efc3b8}.danger h3{color:var(--r)}.btn.rd{background:var(--r)}.btn.rd:hover{background:#b8442b}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 2px 0 var(--line);min-width:0}
.card h3{margin:0 0 12px;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.span2{grid-column:span 2}.full{grid-column:1/-1}
.row{padding:10px 0;border-bottom:1px dashed var(--line)}.row:last-child{border:0}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 9px;border-radius:99px;background:#e7efe9;color:var(--g)}
.tag.y{background:#fdf0cd;color:#8a6200}.tag.r{background:#fbe1da;color:var(--r)}.tag.b{background:#dfe9f7;color:var(--b)}
input,select,textarea{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%;color:var(--ink)}
input::placeholder,textarea::placeholder{color:#b3b8b4}
textarea{min-height:90px}label{font-size:13px;font-weight:700;color:var(--mute);display:block;margin:10px 0 4px}
.btn{font:inherit;font-weight:700;padding:9px 18px;border-radius:10px;border:0;background:var(--g);color:#fff;cursor:pointer;white-space:nowrap;flex-shrink:0}
.btn:hover{background:var(--g2)}.btn.s{padding:5px 12px;font-size:13px}.btn.o{background:#fff;color:var(--g);border:1px solid var(--g)}.btn.d{background:#fff;color:var(--r);border:1px solid #efc3b8}
.link{all:unset;cursor:pointer;font-weight:700;color:var(--ink);border-bottom:1px dashed transparent}.link:hover{color:var(--g2);border-color:var(--g2)}
.meal{white-space:pre-line;line-height:1.9}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:13px}
.cal div{min-height:64px;padding:4px 6px;border-radius:8px;background:#fbf7ea;min-width:0}.cal .h{min-height:0;text-align:center;background:none;font-weight:700;color:var(--mute)}
.cal .t{outline:2px solid var(--y)}.cal i{display:block;font-style:normal;font-size:11px;background:#dfe9f7;color:var(--b);border-radius:4px;padding:0 4px;margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--mute);font-size:12px;padding:8px;border-bottom:2px solid var(--line);white-space:nowrap}td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.login{max-width:420px;margin:12vh auto;width:100%}.flex{display:flex;gap:10px;align-items:center}.flex>div{flex:1}.mute{color:var(--mute);font-size:13px}
.mb{position:fixed;inset:0;background:#1d2a2466;display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.md{background:var(--card);border-radius:18px;padding:28px;width:min(760px,100%);max-height:90vh;overflow:auto;position:relative;box-shadow:0 20px 60px #0003}
.md.sm{width:min(400px,100%)}.x{position:absolute;top:14px;right:16px;border:0;background:none;font-size:26px;cursor:pointer;color:var(--mute)}
.big{white-space:pre-wrap;font-size:17px;line-height:1.8;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;min-height:120px}
.big img{max-width:100%;border-radius:10px;margin-top:10px}
.pwv{font-family:ui-monospace,Consolas,monospace;font-weight:700;letter-spacing:2px}.pwv.on{background:#fdf0cd;color:#8a6200;padding:2px 8px;border-radius:6px;font-size:16px}
tr.hit td{background:#fbf7ea}
@media(max-width:1100px){.grid,.g2{grid-template-columns:1fr}.span2{grid-column:auto}aside{width:190px}main{padding:20px}}
</style>
</head>
<body>
<aside id="side"></aside><main id="main"></main><div id="modal"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {getFirestore,collection,doc,setDoc,deleteDoc,getDoc,onSnapshot,writeBatch} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
// 기존 과제 제출 웹앱과 같은 Firebase 프로젝트 (students / assignments / submissions 그대로 연동)
const db=getFirestore(initializeApp({apiKey:"AIzaSyBdyDgmPFg-Py1ej87klSWqXB8TC5yixkU",authDomain:"assignment-submission-hs.firebaseapp.com",projectId:"assignment-submission-hs",storageBucket:"assignment-submission-hs.firebasestorage.app",messagingSenderId:"702547388370",appId:"1:702547388370:web:f47dc11400725b67324a0b"}));
const COLS=["students","assignments","submissions","notices","assessments","board","counsel","schedule","meals"];
const S={user:null,page:"home",ym:new Date().toISOString().slice(0,7),mealDate:new Date().toISOString().slice(0,10),sf:{a:"",g:"",c:"",sort:"sid"},asort:(()=>{try{return localStorage.getItem("asort")||"dl"}catch(e){return "dl"}})(),stq:"",pwShow:""};let pwTimer=0;COLS.forEach(c=>S[c]=[]);
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)},T=()=>S.user?.role==="teacher",st=()=>S.user?.data;
const put=(c,o)=>setDoc(doc(db,c,o.id),o,{merge:true});
const del=async(c,id)=>{if(!confirm("삭제할까요?"))return;await deleteDoc(doc(db,c,id));closeModal()};
const uid=p=>p+Date.now()+Math.random().toString(36).slice(2,5);
const dday=d=>{const n=Math.round((new Date(d)-new Date(today()))/864e5);return n===0?"D-Day":n>0?"D-"+n:"D+"+-n};
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,"0")).join("");
const modal=(h,sm)=>{$("#modal").innerHTML=`<div class="mb" data-close="1"><div class="md ${sm?"sm":""}"><button class="x" data-close="1">×</button>${h}</div></div>`;setTimeout(()=>$("#modal input:not([type=file]),#modal textarea")?.focus(),30)};
const closeModal=()=>$("#modal").innerHTML="";
// 대상(학년/반/학생) 필터: 0 또는 공란 = 전체
const mine=o=>T()||((!o.grade||o.grade==st().grade)&&(!o.classNum||o.classNum==st().classNum)&&(!o.studentId||o.studentId===st().studentId));
const tgt=o=>(o.studentId?`${o.studentId} 개인`:o.grade?`${o.grade}학년${o.classNum?" "+o.classNum+"반":""}`:"전체");
const tgtFields=()=>`<div class="flex"><div><label>학년</label><input id="f-grade" type="number" min="0" max="3" placeholder="전체: 0"></div><div><label>반</label><input id="f-class" type="number" min="0" placeholder="전체: 0"></div><div><label>학번(선택)</label><input id="f-sid" placeholder="예: 10101"></div></div>`;
const tgtVals=()=>({grade:+$("#f-grade").value||0,classNum:+$("#f-class").value||0,studentId:$("#f-sid").value.trim()});
// 과제 정렬: 기본은 마감 임박순(마감 없는 '상시' 과제는 맨 뒤)
const dlKey=a=>a.deadline||"9999";
const ASORT={dl:["마감 임박순",(a,b)=>dlKey(a).localeCompare(dlKey(b))],dlr:["마감 늦은순",(a,b)=>dlKey(b).localeCompare(dlKey(a))],title:["제목 가나다순",(a,b)=>a.title.localeCompare(b.title,"ko")],titler:["제목 역순",(a,b)=>b.title.localeCompare(a.title,"ko")],new:["최근 등록순",(a,b)=>String(b.id).localeCompare(String(a.id))],old:["등록순",(a,b)=>String(a.id).localeCompare(String(b.id))]};
const myAssigns=()=>S.assignments.filter(a=>T()||(a.grade==st().grade&&(!a.classes?.length||a.classes.map(Number).includes(+st().classNum)))).sort((a,b)=>(ASORT[S.asort]||ASORT.dl)[1](a,b)||a.title.localeCompare(b.title,"ko"));
const asortSel=()=>`<select data-asort="1" style="width:auto;padding:4px 8px;font-size:13px">${Object.entries(ASORT).map(([k,[t]])=>`<option value="${k}" ${S.asort===k?"selected":""}>${t}</option>`).join("")}</select>`;
// 공지·수행평가 첨부: 링크 + 여러 파일 (Firestore 문서 한도 때문에 합계 700KB 이하)
const attachFields=()=>`<label>링크(선택)</label><input id="x-link" placeholder="https://"><label>첨부파일(선택, 여러 개 가능 · 합계 700KB 이하)</label><input id="x-files" type="file" multiple>`;
async function readAttach(){const fs=[...$("#x-files").files],sum=fs.reduce((t,f)=>t+f.size,0);
 if(sum>7e5){alert(`첨부파일 합계가 ${Math.round(sum/1024)}KB입니다. 700KB 이하로 줄이거나, 큰 파일은 드라이브 링크로 올려 주세요.`);return null}
 const files=await Promise.all(fs.map(f=>new Promise(r=>{const x=new FileReader;x.onload=e=>r({fileName:f.name,fileData:e.target.result});x.readAsDataURL(f)})));
 return {linkUrl:$("#x-link").value.trim(),files}}
const attachView=o=>`${o.linkUrl?`<div><a href="${esc(o.linkUrl)}" target="_blank">🔗 ${esc(o.linkUrl)}</a></div>`:""}${(o.files||[]).map(f=>`<div><a href="${f.fileData}" download="${esc(f.fileName)}">📎 ${esc(f.fileName)}</a></div>`).join("")}`;
const clip=o=>(o.files?.length||o.linkUrl)?` <span class="mute" title="첨부 있음">📎</span>`:"";
const sidKey=s=>(+s.grade||0)*1e4+(+s.classNum||0)*100+(+s.num||0);
const fmtDl=d=>d?esc(d.replace("T"," "))+" 마감":"상시";
const RESET=[["schedule","학사일정"],["meals","급식"],["students","학생 명단"],["notices","공지사항"],["assessments","수행평가"],["assignments","과제"],["submissions","제출물"],["board","방명록"],["counsel","상담 신청"]];
const NAV=[["home","🏠 홈"],["notice","📢 공지사항"],["assess","📝 수행평가"],["assign","📥 과제 제출"],["board","💬 방명록"],["counsel","🤝 상담 신청"]];
function side(){$("#side").innerHTML=`<h1>신현준T</h1><small>교과 통합관리</small>`+(S.user?NAV.concat(T()?[["admin","⚙️ 관리"]]:[["settings","🔒 설정"]]).map(([k,v])=>`<button class="nav ${S.page===k?"on":""}" data-go="${k}">${v}</button>`).join("")+`<div class="who"><b>${T()?"교사":esc(st().name)}</b><br><span style="color:#a9c7ba">${T()?"관리자 모드":`${st().grade}학년 ${st().classNum}반 ${st().num}번`}</span><br><button class="btn s o" style="margin-top:8px" data-act="logout">로그아웃</button></div>`:"")}
function render(){side();const m=$("#main");if(!S.user){m.innerHTML=`<div class="card login"><h2>로그인</h2><p class="sub">학번을 입력하세요.</p><input id="login-id" placeholder="예: 10101" autocomplete="off"><button class="btn" data-act="login" style="width:100%;margin-top:12px">로그인</button></div>`;setTimeout(()=>$("#login-id")?.focus(),30);return}
m.innerHTML=({home,notice,assess,assign,board,counsel,admin,settings})[S.page]();if(S.page==="admin"){filterRoster();paintPw()}}

// ───── 홈
function monthCal(){const[y,mo]=S.ym.split("-").map(Number),first=new Date(y,mo-1,1).getDay(),n=new Date(y,mo,0).getDate();let h=["일","월","화","수","목","금","토"].map(d=>`<div class="h">${d}</div>`).join("")+"<div></div>".repeat(first);
for(let d=1;d<=n;d++){const ds=`${S.ym}-${String(d).padStart(2,"0")}`;h+=`<div class="${ds===today()?"t":""}"><b>${d}</b>${S.schedule.filter(e=>e.date===ds).map(e=>`<i title="${esc(e.name)}">${esc(e.name)}</i>`).join("")}${S.assessments.filter(mine).filter(a=>a.date===ds).map(a=>`<i class="as" data-assess="${a.id}" title="수행평가: ${esc(a.title)}">📝 ${esc(a.title)}</i>`).join("")}${myAssigns().filter(a=>a.deadline?.slice(0,10)===ds).map(a=>`<i class="dl" data-open="${a.id}" title="과제 마감: ${esc(a.title)}">📥 ${esc(a.title)}</i>`).join("")}</div>`}return h}
function home(){const meal=S.meals.filter(x=>x.date===S.mealDate).sort((a,b)=>"조중석".indexOf((a.type||"중")[0])-"조중석".indexOf((b.type||"중")[0])),nt=S.notices.filter(mine).sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,5),as=S.assessments.filter(mine).filter(a=>a.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);
const due=myAssigns().filter(a=>!a.deadline||a.deadline.slice(0,10)>=today()).slice(0,5);
return `<h2>안녕하세요${T()?", 선생님":", "+esc(st().name)+" 학생"} 👋</h2><p class="sub">${today()} · 오늘의 학교 소식</p><div class="grid">
<div class="card span2"><h3>📅 학사일정 <span class="flex"><button class="btn s o" data-ym="-1">◀</button><b>${S.ym}</b><button class="btn s o" data-ym="1">▶</button></span></h3><div class="cal">${monthCal()}</div><div class="legend"><span style="--c:#dfe9f7">학사일정</span><span style="--c:#fbe1da">수행평가</span><span style="--c:#fdf0cd">과제 마감</span></div></div>
<div class="card"><h3>🍚 급식 <input type="date" id="mealDate" value="${S.mealDate}" style="width:auto;padding:3px 8px"></h3><div class="meal">${meal.length?meal.map(x=>`<span class="tag y">${esc(x.type||"중식")}</span>\n${esc(x.menu)}`).join("\n\n"):'<span class="mute">등록된 급식 정보가 없습니다.</span>'}</div></div>
<div class="card"><h3>📢 공지사항 <button class="btn s o" data-go="notice">전체</button></h3>${nt.map(n=>`<div class="row"><span class="tag">${tgt(n)}</span> <button class="link" data-notice="${n.id}">${esc(n.title)}</button>${clip(n)}<div class="mute">${n.createdAt.slice(0,10)}</div></div>`).join("")||'<span class="mute">새로운 공지사항이 없습니다.</span>'}</div>
<div class="card"><h3>📝 수행평가 안내 <button class="btn s o" data-go="assess">전체</button></h3>${as.map(a=>`<div class="row"><span class="tag r">${dday(a.date)}</span> <button class="link" data-assess="${a.id}">${esc(a.title)}</button>${clip(a)}<div class="mute">${esc(a.subject)} · ${a.date}</div></div>`).join("")||'<span class="mute">예정된 수행평가가 없습니다.</span>'}</div>
<div class="card"><h3>📥 과제 <span class="flex">${asortSel()}<button class="btn s o" data-go="assign">전체</button></span></h3>${due.map(a=>`<div class="row"><button class="link" data-open="${a.id}">${esc(a.title)}</button> <span class="tag y">${a.deadline?dday(a.deadline.slice(0,10)):"상시"}</span><div class="mute">${esc(a.subject||"")}</div></div>`).join("")||'<span class="mute">진행 중인 과제가 없습니다.</span>'}</div></div>`}

// ───── 공지 / 수행평가
function notice(){return `<h2>공지사항</h2><p class="sub">학년·반·학생별로 지정된 공지사항만 표시됩니다.</p><div class="${T()?"g2":""}"><div class="card">${S.notices.filter(mine).sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).map(n=>`<div class="row"><span class="tag">${tgt(n)}</span> <b>${esc(n.title)}</b> ${T()?`<button class="btn s d" data-del="notices:${n.id}">삭제</button>`:""}<div style="white-space:pre-line">${esc(n.body)}</div>${attachView(n)}<div class="mute">${n.createdAt.slice(0,10)}</div></div>`).join("")||'<span class="mute">새로운 공지사항이 없습니다.</span>'}</div>
${T()?`<div class="card"><h3>새 공지 작성</h3><label>제목</label><input id="n-title"><label>내용</label><textarea id="n-body"></textarea>${attachFields()}${tgtFields()}<br><button class="btn" data-act="addNotice">등록</button></div>`:""}</div>`}
function assess(){return `<h2>수행평가 안내</h2><p class="sub">일정과 평가 기준을 확인하세요.</p><div class="${T()?"g2":""}"><div class="card">${S.assessments.filter(mine).sort((a,b)=>a.date.localeCompare(b.date)).map(a=>`<div class="row"><span class="tag r">${dday(a.date)}</span> <b>${esc(a.title)}</b> <span class="tag b">${esc(a.subject)}</span> <span class="tag">${tgt(a)}</span> ${T()?`<button class="btn s d" data-del="assessments:${a.id}">삭제</button>`:""}<div class="mute">${a.date}</div><div style="white-space:pre-line">${esc(a.desc)}</div>${attachView(a)}</div>`).join("")||'<span class="mute">등록된 수행평가가 없습니다.</span>'}</div>
${T()?`<div class="card"><h3>수행평가 등록</h3><label>과목</label><input id="a-subj"><label>제목</label><input id="a-title"><label>평가 기준·유의사항</label><textarea id="a-desc"></textarea>${attachFields()}${tgtFields()}<label>실시일</label><input id="a-date" type="date"><br><br><button class="btn" data-act="addAssess">등록</button></div>`:""}</div>`}

// ───── 과제 제출
function assign(){const as=myAssigns(),cnt=id=>new Set(S.submissions.filter(s=>s.assignmentId===id).map(s=>s.studentId)).size;

await batchPut("meals",mr.map(r=>({id:"n"+r.MLSV_YMD+r.MMEAL_SC_CODE,date:ymd(r.MLSV_YMD),type:r.MMEAL_SC_NM,menu:r.DDISH_NM.replace(/<br\s*\/?>/g,"\n").replace(/\s*\([\d.,\s]+\)/g,""),src:"neis"})));
msg.textContent=`완료: 일정 ${rows.length}건, 급식 ${mr.length}건`}catch(e){msg.textContent="실패 — 키/코드를 확인하거나 CSV·직접 입력을 이용하세요."}}
function enter(user){S.user=user;S.page="home";closeModal();render()}
const A={
login(){const v=$("#login-id").value.trim();if(!v)return;
 if(v==="교사"||v==="관리자")return modal(`<h2>교사 로그인</h2><label>비밀번호</label><input id="pw-in" type="password"><br><br><button class="btn" data-act="pwOk" data-who="t" style="width:100%">확인</button>`,1);
 const s=S.students.find(x=>x.studentId===v);if(!s)return alert("등록되지 않은 학번입니다.");
 if(!s.pw)return enter({role:"student",data:s});
 modal(`<h2>${esc(s.name)} 학생</h2><label>비밀번호</label><input id="pw-in" type="password"><br><br><button class="btn" data-act="pwOk" data-who="${s.id}" style="width:100%">확인</button>`,1)},
async pwOk(who){const p=$("#pw-in").value;if(!p)return;
 if(who==="t"){const r=await getDoc(doc(db,"config","admin")),h=await sha(p);if(!r.exists())await setDoc(doc(db,"config","admin"),{h});else if(r.data().h!==h)return alert("비밀번호가 틀립니다.");return enter({role:"teacher"})}
 const s=S.students.find(x=>x.id===who);if(s?.pw===p)enter({role:"student",data:s});else alert("비밀번호가 틀립니다.")},
logout(){S.user=null;S.pwShow="";S.stq="";clearTimeout(pwTimer);render()},
async addNotice(){const t=$("#n-title").value.trim();if(!t)return alert("제목을 입력하세요.");const x=await readAttach();if(!x)return;await put("notices",{id:uid("n"),title:t,body:$("#n-body").value,createdAt:new Date().toISOString(),...tgtVals(),...x});alert("등록되었습니다.");render()},
async addAssess(){const t=$("#a-title").value.trim(),d=$("#a-date").value;if(!t||!d)return alert("제목과 실시일을 입력하세요.");const x=await readAttach();if(!x)return;await put("assessments",{id:uid("as"),subject:$("#a-subj").value,title:t,date:d,desc:$("#a-desc").value,...tgtVals(),...x});alert("등록되었습니다.");render()},
async addAssign(){const v=assignVals();if(!v.title)return alert("제목을 입력하세요.");const files=await readAssignFiles();if(!files)return;await put("assignments",{id:uid("assign_"),...v,files,order:S.assignments.length+1,createdAt:today()});alert("등록되었습니다.");render()},
async saveAssign(id){const v=assignVals();if(!v.title)return alert("제목을 입력하세요.");const a=S.assignments.find(x=>x.id===id),files=await readAssignFiles(a.files||[]);if(!files)return;await setDoc(doc(db,"assignments",id),{...a,...v,files});
 // 과제 제목이 바뀌면 제출물에 저장된 과제명도 함께 갱신
 if(a.title!==v.title)await batchPut("submissions",S.submissions.filter(s=>s.assignmentId===id).map(s=>({id:s.id,assignmentTitle:v.title})));closeModal()},
async doSubmit(id){const a=S.assignments.find(x=>x.id===id),f=$("#u-file").files[0];let fileName="",fileData="";
 if(!$("#u-body").value.trim()&&!$("#u-url").value.trim()&&!f)return alert("내용, 링크, 첨부파일 중 하나 이상을 입력해야 제출할 수 있습니다.");
 if(f){if(f.size>7e5)return alert("파일이 700KB를 초과합니다. 링크로 제출해 주세요.");fileName=f.name;fileData=await new Promise(r=>{const x=new FileReader;x.onload=e=>r(e.target.result);x.readAsDataURL(f)})}
 const now=new Date(),s=st();await put("submissions",{id:"sub_"+Date.now(),assignmentId:id,assignmentTitle:a.title,subTitle:$("#u-sub").value||"제출물",studentId:s.studentId,studentName:s.name,grade:s.grade,classNum:s.classNum,num:s.num,content:$("#u-body").value.trim(),fileName,fileData,webUrl:$("#u-url").value.trim(),submittedAt:now.toLocaleString("ko-KR"),isLate:!!a.deadline&&now>new Date(a.deadline)});closeModal();alert("제출되었습니다.")},
addBoard(){const t=$("#b-text").value.trim();if(t)put("board",{id:uid("b"),name:T()?"선생님":st().name,studentId:st()?.studentId||"",text:t,createdAt:new Date().toISOString()})},
addCounsel(){const b=$("#c-body").value.trim();if(!b)return alert("내용을 입력하세요.");put("counsel",{id:uid("c"),studentId:st().studentId,name:st().name,date:$("#c-date").value,type:$("#c-type").value,body:b,reply:"",createdAt:new Date().toISOString()});alert("신청되었습니다.")},
addSched(){const n=$("#m-name").value.trim();if(n)put("schedule",{id:uid("m"),date:$("#m-date").value,name:n})},
addMeal(){const m=$("#g-menu").value.trim();if(m)put("meals",{id:"m"+$("#g-date").value+$("#g-type").value,date:$("#g-date").value,type:$("#g-type").value,menu:m})},
addStudent(){const i=$("#st-id").value.trim(),n=$("#st-name").value.trim();if(/^\d{5}$/.test(i)&&n)put("students",mkStu(i,n));else alert("학번 5자리와 이름을 입력하세요.")},
async stuPw(){const a=$("#sp1").value,b=$("#sp2").value;if(a.length<4)return alert("4자 이상 입력하세요.");if(a!==b)return alert("두 비밀번호가 다릅니다.");await put("students",{id:st().id,pw:a});S.user.data={...st(),pw:a};alert("저장되었습니다. 다음 로그인부터 비밀번호가 필요합니다.");render()},
async setPin(){const p=$("#np").value;if(p.length>=4){await setDoc(doc(db,"config","admin"),{h:await sha(p)});alert("변경되었습니다.")}else alert("4자 이상 입력하세요.")},
neis,
rsAll(){const b=document.querySelectorAll(".rs"),on=[...b].some(x=>!x.checked);b.forEach(x=>x.checked=on)},
backup(){const ks=[...document.querySelectorAll(".rs:checked")].map(x=>x.value);if(!ks.length)return alert("백업할 항목을 선택하세요.");
 const o={};ks.forEach(k=>o[k]=S[k]);const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:"application/json"}));a.download=`백업_${today()}.json`;a.click()},
async doReset(){const ks=[...document.querySelectorAll(".rs:checked")].map(x=>x.value);if(!ks.length)return alert("초기화할 항목을 하나 이상 선택하세요.");
 const names=ks.map(k=>RESET.find(r=>r[0]===k)[1]).join(", ");if(!confirm(`[${names}] 데이터를 모두 삭제합니다. 되돌릴 수 없습니다. 계속할까요?`))return;
 if(prompt("확인을 위해 '초기화'라고 입력하세요.")!=="초기화")return alert("취소되었습니다.");
 try{for(const k of ks){const ids=S[k].map(x=>x.id);for(let i=0;i<ids.length;i+=400){const b=writeBatch(db);ids.slice(i,i+400).forEach(id=>b.delete(doc(db,k,id)));await b.commit()}}alert(`[${names}] 초기화가 완료되었습니다.`)}catch(e){alert("초기화 중 오류가 발생했습니다.")}}};
document.addEventListener("click",e=>{if(e.target.dataset?.close)return closeModal();
const t=e.target.closest("[data-act],[data-go],[data-ym],[data-del],[data-open],[data-view],[data-reply],[data-pwreset],[data-pwshow],[data-notice],[data-assess]");if(!t)return;const d=t.dataset;
if(d.go){S.page=d.go;render()}
else if(d.ym){const[y,m]=S.ym.split("-").map(Number),n=new Date(y,m-1+ +d.ym,1);S.ym=n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0");render()}
else if(d.del){e.preventDefault();const[c,id]=d.del.split(":");del(c,id)}
else if(d.open)openAssign(d.open);else if(d.view)viewSub(d.view);
else if(d.notice){const n=S.notices.find(x=>x.id===d.notice);modal(`<span class="tag">${tgt(n)}</span><h2 style="margin-top:6px">${esc(n.title)}</h2><p class="sub">${n.createdAt.slice(0,10)}</p><div class="big">${esc(n.body)}</div><div style="margin-top:12px">${attachView(n)}</div>`)}
else if(d.assess){const a=S.assessments.find(x=>x.id===d.assess);modal(`<span class="tag r">${dday(a.date)}</span> <span class="tag b">${esc(a.subject)}</span><h2 style="margin-top:6px">${esc(a.title)}</h2><p class="sub">실시일 ${a.date}</p><div class="big">${esc(a.desc)}</div><div style="margin-top:12px">${attachView(a)}</div>`)}
else if(d.reply){put("counsel",{id:d.reply,reply:$("#r-"+d.reply).value})}
else if(d.pwshow)showPw(d.pwshow);
else if(d.pwreset){e.preventDefault();if(confirm("비밀번호를 초기화할까요? (학번만으로 로그인 가능)"))put("students",{id:d.pwreset,pw:""})}
else A[d.act]?.(d.id||d.who)});
document.addEventListener("input",e=>{if(e.target.id==="st-q"){S.stq=e.target.value;filterRoster()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&e.target.id==="st-q"){S.stq="";e.target.value="";return filterRoster()}if(e.key==="Escape")closeModal();if(e.key!=="Enter"||e.isComposing)return;if(e.target.id==="login-id")A.login();if(e.target.id==="pw-in")$("#modal [data-act=pwOk]").click()});
document.addEventListener("change",async e=>{if(e.target.id==="mealDate"){S.mealDate=e.target.value;return render()}
if(e.target.dataset.asort){S.asort=e.target.value;try{localStorage.setItem("asort",S.asort)}catch(err){}return render()}
if(e.target.dataset.sf){const k=e.target.dataset.sf;S.sf[k]=e.target.value;if(k==="g")S.sf.c="";return render()}
const k=e.target.dataset.csv;if(!k)return;const rows=csv(await e.target.files[0].text());
const arr=k==="schedule"?rows.filter(r=>/^\d{4}-\d{2}-\d{2}$/.test(r[0])).map(r=>({id:uid("f"),date:r[0],name:r[1]})):k==="meals"?rows.filter(r=>/^\d{4}-\d{2}-\d{2}$/.test(r[0])).map(r=>({id:"m"+r[0]+(r[1]||"중식"),date:r[0],type:r[1]||"중식",menu:(r[2]||"").split("/").join("\n")})):rows.filter(r=>/^\d{5}$/.test(r[0])).map(r=>mkStu(r[0],r[1]));
await batchPut(k,arr);alert(arr.length+"건을 불러왔습니다.")});
COLS.forEach(c=>onSnapshot(collection(db,c),s=>{S[c]=s.docs.map(d=>d.data());
 if(c==="students"&&S.user?.role==="student"){const me=S[c].find(x=>x.id===st().id);if(me)S.user.data=me}
 if(!document.activeElement?.matches("#main input,#main textarea,#main select"))render()}));
render();
</script>
